        /* Ambient Glow Animation */
        @keyframes gentleGlow {
            0% { opacity: 0.6; transform: scale(0.95) translate(-50%, -50%); }
            50% { opacity: 0.9; transform: scale(1.05) translate(-45%, -55%); }
            100% { opacity: 0.6; transform: scale(0.95) translate(-50%, -50%); }
        }
        
        @keyframes floatUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-glow {
            animation: gentleGlow 8s infinite alternate ease-in-out;
            transform-origin: center center;
        }
        
        .animate-fade-in-up {
            animation: floatUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
