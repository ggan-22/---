        /* Choice Card Animations */

        /* Button Animation */

<!-- Fixed Bottom Action -->

<!-- Note: BottomNavBar is intentionally suppressed here because this is a transactional onboarding/setup flow, not a top-level destination. -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const choiceCards = document.querySelectorAll('.choice-card');
            const continueBtn = document.getElementById('continueBtn');
            let selectedCount = 0;

            choiceCards.forEach(card => {
                card.addEventListener('click', () => {
                    const isSelected = card.classList.contains('selected');
                    
                    if (isSelected) {
                        card.classList.remove('selected');
                        card.setAttribute('aria-pressed', 'false');
                        selectedCount--;
                    } else {
                        card.classList.add('selected');
                        card.setAttribute('aria-pressed', 'true');
                        selectedCount++;
                    }

                    // Update button state
                    if (selectedCount > 0) {
                        continueBtn.removeAttribute('disabled');
                        // Add glow effect when active
                        continueBtn.style.boxShadow = '0 0 40px rgba(210, 241, 248, 0.6), 0px 12px 32px rgba(30,41,59,0.04)';
                    } else {
                        continueBtn.setAttribute('disabled', 'true');
                        continueBtn.style.boxShadow = '0px 12px 32px rgba(30,41,59,0.04)';
                    }
                });
            });
        });
    </script>
