<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Post-Shower Skin Check-in</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#dadedb",
              "primary-fixed-dim": "#74d5e1",
              "inverse-primary": "#74d5e1",
              "secondary-fixed-dim": "#c3c7c5",
              "on-surface-variant": "#3e494a",
              "tertiary-fixed-dim": "#adccd3",
              "surface": "#f9f9ff",
              "error": "#ba1a1a",
              "outline-variant": "#bdc9ca",
              "tertiary": "#466369",
              "on-tertiary": "#ffffff",
              "inverse-on-surface": "#ecf1ff",
              "error-container": "#ffdad6",
              "surface-tint": "#006972",
              "surface-dim": "#cfdaf2",
              "background": "#f9f9ff",
              "surface-container": "#e7eeff",
              "tertiary-fixed": "#c9e8ef",
              "on-tertiary-container": "#223f45",
              "on-tertiary-fixed-variant": "#2f4b51",
              "on-tertiary-fixed": "#001f25",
              "on-background": "#111c2d",
              "primary-container": "#4fb3bf",
              "surface-variant": "#d8e3fb",
              "on-error": "#ffffff",
              "surface-container-highest": "#d8e3fb",
              "primary-fixed": "#91f1fe",
              "secondary": "#5b5f5d",
              "surface-container-lowest": "#ffffff",
              "primary": "#006972",
              "on-primary-container": "#004248",
              "tertiary-container": "#8caab1",
              "on-primary-fixed-variant": "#004f56",
              "surface-bright": "#f9f9ff",
              "on-secondary-fixed": "#181d1b",
              "on-error-container": "#93000a",
              "surface-container-high": "#dee8ff",
              "on-primary-fixed": "#001f23",
              "surface-container-low": "#f0f3ff",
              "on-surface": "#111c2d",
              "on-primary": "#ffffff",
              "on-secondary-container": "#5d6260",
              "secondary-fixed": "#dfe3e1",
              "on-secondary": "#ffffff",
              "inverse-surface": "#263143",
              "outline": "#6e797b",
              "on-secondary-fixed-variant": "#434846",
              
              // Custom semantic colors from prompt
              "aqua-glow": "#D2F1F8",
              "sage-bg": "#F0F4F1"
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
              "24px": "24px"
            },
            spacing: {
              gutter: "16px",
              "section-gap": "48px",
              "container-margin": "24px",
              "card-padding": "24px",
              "stack-sm": "8px",
              "stack-md": "16px",
              "safe-bottom": "env(safe-area-inset-bottom)"
            },
            fontFamily: {
              "label-caps": ["Plus Jakarta Sans"],
              "body-md": ["Plus Jakarta Sans"],
              "headline-md": ["Plus Jakarta Sans"],
              "body-lg": ["Plus Jakarta Sans"],
              "headline-lg-mobile": ["Plus Jakarta Sans"],
              "display-timer": ["Plus Jakarta Sans"],
              "headline-lg": ["Plus Jakarta Sans"]
            },
            fontSize: {
              "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.08em", fontWeight: "700" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "500" }],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "headline-lg-mobile": ["28px", { lineHeight: "36px", fontWeight: "600" }],
              "display-timer": ["80px", { lineHeight: "96px", letterSpacing: "-0.04em", fontWeight: "300" }],
              "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }]
            },
            boxShadow: {
              'ambient': '0px 12px 32px rgba(30, 41, 59, 0.04)',
              'glow': '0 0 40px rgba(210, 241, 248, 0.6)'
            }
          }
        }
      }
    </script>
<style>
      body {
        -webkit-tap-highlight-color: transparent;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }
      .state-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .state-card.selected {
        background-color: theme('colors.aqua-glow');
        border: 2px solid theme('colors.primary-container');
        box-shadow: theme('boxShadow.glow');
      }
      .state-card.selected .material-symbols-outlined {
        color: theme('colors.primary-container');
        font-variation-settings: 'FILL' 1;
      }
      .state-card.selected span {
        color: theme('colors.primary-container');
        font-weight: 500;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Suppressed as this is a linear flow/task screen) -->
<main class="flex-grow flex flex-col px-container-margin max-w-2xl mx-auto w-full pb-24 pt-8 md:pt-12">
<!-- Header -->
<header class="text-center mb-section-gap">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-on-surface tracking-tight">
                지금 피부 상태는 어떤가요?
            </h1>
</header>
<!-- Skin State Grid -->
<div class="grid grid-cols-2 gap-stack-md mb-section-gap flex-grow content-start"><!-- Tight -->
<button aria-pressed="false" class="state-card bg-sage-bg rounded-24px p-card-padding flex flex-col items-center justify-center gap-stack-md border-2 border-transparent aspect-square shadow-ambient hover:bg-surface-variant focus:outline-none" onclick="selectCard(this)">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant">compress</span>
<span class="font-body-lg text-on-surface-variant">당김</span>
</button>
<!-- Dry -->
<button aria-pressed="false" class="state-card bg-sage-bg rounded-24px p-card-padding flex flex-col items-center justify-center gap-stack-md border-2 border-transparent aspect-square shadow-ambient hover:bg-surface-variant focus:outline-none" onclick="selectCard(this)">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant">texture</span>
<span class="font-body-lg text-on-surface-variant">건조함</span>
</button>
<!-- Sensitive -->
<button aria-pressed="false" class="state-card bg-sage-bg rounded-24px p-card-padding flex flex-col items-center justify-center gap-stack-md border-2 border-transparent aspect-square shadow-ambient hover:bg-surface-variant focus:outline-none" onclick="selectCard(this)">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant">flare</span>
<span class="font-body-lg text-on-surface-variant">민감함</span>
</button>
<!-- Itchy -->
<button aria-pressed="false" class="state-card bg-sage-bg rounded-24px p-card-padding flex flex-col items-center justify-center gap-stack-md border-2 border-transparent aspect-square shadow-ambient hover:bg-surface-variant focus:outline-none" onclick="selectCard(this)">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant">back_hand</span>
<span class="font-body-lg text-on-surface-variant">가려움</span>
</button>
<!-- Normal -->
<button aria-pressed="false" class="state-card bg-sage-bg rounded-24px p-card-padding flex flex-col items-center justify-center gap-stack-md border-2 border-transparent aspect-square shadow-ambient hover:bg-surface-variant focus:outline-none" onclick="selectCard(this)">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant">water_drop</span>
<span class="font-body-lg text-on-surface-variant">보통</span>
</button>
<!-- Great -->
<button aria-pressed="false" class="state-card bg-sage-bg rounded-24px p-card-padding flex flex-col items-center justify-center gap-stack-md border-2 border-transparent aspect-square shadow-ambient hover:bg-surface-variant focus:outline-none" onclick="selectCard(this)">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant">auto_awesome</span>
<span class="font-body-lg text-on-surface-variant">매우 좋아요</span>
</button></div>
<!-- Bottom Actions -->
<div class="mt-auto flex flex-col gap-stack-md pb-safe-bottom pt-stack-md">
<button class="w-full h-[56px] bg-primary-container text-white rounded-2xl font-body-lg font-medium tracking-wide shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200">
                저장하기
            </button>
<button class="w-full py-3 text-secondary font-body-md hover:text-on-surface transition-colors active:scale-[0.98]">
                건너뛰기
            </button>
</div>
</main>
<!-- Bottom Navigation (Suppressed as this is a linear flow/task screen) -->
<script>
        function selectCard(clickedButton) {
            // Remove 'selected' class from all cards
            document.querySelectorAll('.state-card').forEach(card => {
                card.classList.remove('selected');
                card.setAttribute('aria-pressed', 'false');
            });

            // Add 'selected' class to clicked card
            clickedButton.classList.add('selected');
            clickedButton.setAttribute('aria-pressed', 'true');
        }
    </script>




<script src="../screen-bridge.js"></script></body></html>
