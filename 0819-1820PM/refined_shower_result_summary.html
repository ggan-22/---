<script>
  document.addEventListener('DOMContentLoaded', () => {
    const messageElement = document.getElementById('showerMessage');
    if (!messageElement) return;

    const urlParams = new URLSearchParams(window.location.search);
    const totalSeconds = parseInt(urlParams.get('time')) || 480;

    function getMessageByTime(seconds) {
      if (seconds < 300) { 

        return "빠르고 산뜻하게 샤워를 마쳤어요. 개운한 하루 되세요!";
      } else if (seconds <= 480) { 
        return "딱 적당하고 건강한 샤워 시간이었어요. 피부가 촉촉해요!";
      } else if (seconds <= 900) { 
        return "오늘은 조금 길게 샤워했어요. 깊은 휴식에 딱 좋아요.";
      } else { 
        return "긴 샤워로 피부가 건조해질 수 있어요. 보습제를 꼼꼼히 발라주세요!";
      }
    }

    messageElement.textContent = getMessageByTime(totalSeconds);
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const timeElement = document.getElementById('measuredTime');
    if (!timeElement) return;

    const urlParams = new URLSearchParams(window.location.search);
    const totalSeconds = parseInt(urlParams.get('time'), 10) || 0;

    const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
    const secs = String(totalSeconds % 60).padStart(2, '0');

    timeElement.textContent = `${mins}:${secs}`;
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const progressBar = document.getElementById('progressBar');
    if (!progressBar) return;

    const urlParams = new URLSearchParams(window.location.search);
    let rawTime = urlParams.get('time');

    if (rawTime === null || rawTime === undefined || rawTime === 'undefined') {
      rawTime = sessionStorage.getItem('shower_time');
    }

    const totalSeconds = parseInt(rawTime, 10) || 0;

    const TARGET_SECONDS = 8; 

    let percentage = (totalSeconds / TARGET_SECONDS) * 100;
    if (percentage > 100) percentage = 100;
    if (percentage < 0) percentage = 0;

    requestAnimationFrame(() => {
      setTimeout(() => {
        progressBar.style.width = `${percentage.toFixed(1)}%`;
      }, 50);
    });
  });
