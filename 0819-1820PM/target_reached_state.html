<!-- Procedural Background -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 w-full h-full opacity-60 mix-blend-multiply" style="display:block;">
<canvas id="shader-canvas-ANIMATION_12" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_12');
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
varying vec2 v_texCoord;

void main() {
    vec2 uv = v_texCoord;
    
    float wave1 = sin(uv.x * 2.5 + u_time * 0.4) * 0.04;
    float wave2 = sin(uv.x * 4.0 - u_time * 0.6) * 0.02;
    
    float finalWave = uv.y + wave1 + wave2;
    
    vec3 colorA = vec3(0.976, 0.976, 1.0);
    vec3 colorB = vec3(0.95, 0.75, 0.55);
    
    float mask = smoothstep(0.3, 0.8, finalWave);
    vec3 finalColor = mix(colorB, colorA, mask);
    
    float pulse = sin(u_time * 0.5) * 0.05 + 0.95;
    finalColor *= pulse;

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script src="./screen-bridge.js"></script>
<script>
  // 전역 변수로 선언하여 모든 함수와 이벤트 핸들러에서 접근 가능하게 함
  let seconds = 0;
  let showerInterval = null;

  document.addEventListener('DOMContentLoaded', () => {
    const timerElement = document.getElementById('timer');
    if (!timerElement) return;

    // URL 파라미터 또는 세션 저장소에서 초기 시간 파싱
    const urlParams = new URLSearchParams(window.location.search);
    const parsedTime = parseInt(urlParams.get('time'), 10);
    
    if (!isNaN(parsedTime)) {
      seconds = parsedTime;
    } else {
      seconds = parseInt(sessionStorage.getItem('shower_time'), 10) || 480;
    }

    const updateDisplay = (totalSecs) => {
      const mins = String(Math.floor(totalSecs / 60)).padStart(2, '0');
      const secs = String(totalSecs % 60).padStart(2, '0');
      timerElement.textContent = `${mins}:${secs}`;
    };

    // 초기 시간 표시 및 세션 즉시 저장
    updateDisplay(seconds);
    sessionStorage.setItem('shower_time', seconds);

    // 1초마다 타이머 증가 및 세션 저장소 실시간 동기화
    showerInterval = setInterval(() => {
      seconds++;
      updateDisplay(seconds);
      sessionStorage.setItem('shower_time', seconds);
    }, 1000);
  });

  document.getElementById('finishShowerBtn').addEventListener('click', (e) => {
    e.preventDefault();

    if (showerInterval) {
      clearInterval(showerInterval);
    }

    sessionStorage.setItem('shower_time', seconds);

    const targetUrl = `refined_shower_result_summary.html?time=${seconds}`;

    if (window.ScreenBridge && typeof window.ScreenBridge.navigateTo === 'function') {
      window.ScreenBridge.navigateTo(targetUrl);
    } else {
      window.location.href = targetUrl;
    }
  });
</script>
